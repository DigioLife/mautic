  # Uncomment to run worker in Docker
  # worker:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #     target: worker
  #   container_name: marketflow_worker
  #   restart: unless-stopped
  #   environment:
  #     NODE_ENV: production
  #     DATABASE_URL: postgresql://marketflow:marketflow_password@postgres:5432/marketflow
  #     REDIS_URL: redis://redis:6379
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

volumes:
  postgres_data:
  redis_data:
