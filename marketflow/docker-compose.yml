version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: marketflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: marketflow
      POSTGRES_USER: marketflow
      POSTGRES_PASSWORD: marketflow_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: marketflow_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Uncomment to run API in Docker
  # api:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #     target: api
  #   container_name: marketflow_api
  #   restart: unless-stopped
  #   ports:
  #     - "4000:4000"
  #   environment:
  #     NODE_ENV: production
  #     DATABASE_URL: postgresql://marketflow:marketflow_password@postgres:5432/marketflow
  #     REDIS_URL: redis://redis:6379
